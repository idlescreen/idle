[package]
name = "idle-cli"
version = "2.5.3"
edition = "2024"
description = "Command-line interface for the IdleScreen daemon"
license = "Apache-2.0"

# Only ship `idlescreen` — never `/usr/bin/idle` (collides with Fedora python3-idle).
[[bin]]
name = "idlescreen"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
journald = ["dep:tracing-journald"]

[dependencies]
idle-dbus = { workspace = true }
libc = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-journald = { workspace = true, optional = true }

[package.metadata.deb]
name = "idle-cli"
changelog = "debian/changelog"
copyright = "2026 IdleScreen"
maintainer = "IdleScreen <jerydleuck@gmail.com>"
extended-description = "CLI for controlling the Idle daemon over D-Bus (command: idlescreen)."
depends = "libc6, idle-daemon"
section = "utils"
priority = "optional"
assets = [
    ["target/release/idlescreen", "usr/bin/idlescreen", "755"],
    # No .desktop here — app launcher entry lives in idle-tui (avoids two "IdleScreen" icons).
    ["assets/idlescreen-beams.png", "usr/share/icons/hicolor/48x48/apps/idlescreen-beams.png", "644"],
    ["idle.1", "usr/share/man/man1/idlescreen.1", "644"],
]

[package.metadata.generate-rpm]
name = "idle-cli"
release = "1"
arch = "x86_64"
summary = "IdleScreen CLI (idlescreen)"
description = "CLI for controlling the Idle daemon over D-Bus (command: idlescreen). Does not install /usr/bin/idle (reserved for python3-idle on Fedora)."
license = "Apache-2.0"
assets = [
    { source = "target/release/idlescreen", dest = "/usr/bin/idlescreen", mode = "755", user = "root", group = "root" },
    { source = "assets/idlescreen-beams.png", dest = "/usr/share/icons/hicolor/48x48/apps/idlescreen-beams.png", mode = "644", user = "root", group = "root" },
    { source = "idle.1", dest = "/usr/share/man/man1/idlescreen.1", mode = "644", user = "root", group = "root" },
]

[package.metadata.generate-rpm.requires]
idle-daemon = "*"
