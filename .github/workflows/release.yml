name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev pkg-config \
            libwayland-dev libxkbcommon-dev \
            libssl-dev \
            libpam0g-dev

      - name: Install Rust (from rust-toolchain.toml)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show
          rustc --version

      - name: Install cargo-binstall
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install cargo-deb and cargo-generate-rpm
        run: cargo binstall -y cargo-deb cargo-generate-rpm

      - name: Build release binaries
        run: cargo build --release

      - name: Determine which packages to publish
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The packages pool is the source of truth for "already
          # distributed". Rebuilding an unchanged version produces
          # byte-different files that trip the importer's no-clobber
          # guard — skip anything whose exact filenames already exist.
          in_pool() {
            gh api "repos/idlescreen/packages/contents/rpm/pool/$1" \
              --jq .name >/dev/null 2>&1 || \
            gh api "repos/idlescreen/packages/contents/apt/pool/main/$2" \
              --jq .name >/dev/null 2>&1
          }
          ver() { grep -m1 '^version' "$1/Cargo.toml" | cut -d'"' -f2; }
          daemon_v=$(ver idle-daemon)
          cli_v=$(ver idle-cli)
          if in_pool "idle-daemon-${daemon_v}-1.x86_64.rpm" "idle-daemon_${daemon_v}-1_amd64.deb"; then
            echo "daemon=skip" >> "$GITHUB_OUTPUT"
          else
            echo "daemon=build" >> "$GITHUB_OUTPUT"
          fi
          if in_pool "idle-cli-${cli_v}-1.x86_64.rpm" "idle-cli_${cli_v}-1_amd64.deb"; then
            echo "cli=skip" >> "$GITHUB_OUTPUT"
          else
            echo "cli=build" >> "$GITHUB_OUTPUT"
          fi
          # idle-plugins-all packages as "idle-savers"; version comes from
          # the crate version like the other crates.
          meta_v=$(ver idle-plugins-all)
          if in_pool "idle-savers-${meta_v}-1.x86_64.rpm" "idle-savers_${meta_v}-1_amd64.deb"; then
            echo "meta=skip" >> "$GITHUB_OUTPUT"
          else
            echo "meta=build" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Package crates
        run: |
          if [ "${{ steps.plan.outputs.daemon }}" = "build" ]; then
            cargo deb --no-build -p idle-daemon
            cargo generate-rpm -p idle-daemon
          fi
          if [ "${{ steps.plan.outputs.cli }}" = "build" ]; then
            cargo deb --no-build -p idle-cli
            cargo generate-rpm -p idle-cli
          fi
          if [ "${{ steps.plan.outputs.meta }}" = "build" ]; then
            cargo deb --no-build -p idle-plugins-all
            cargo generate-rpm -p idle-plugins-all
          fi

      - name: Install Cosign
        run: |
          curl -Lo cosign https://github.com/sigstore/cosign/releases/download/v2.2.4/cosign-linux-amd64
          chmod +x cosign
          sudo mv cosign /usr/local/bin/

      - name: Sign packages with Cosign
        run: |
          shopt -s nullglob
          for file in target/debian/*.deb target/generate-rpm/*.rpm; do
            cosign sign-blob --yes --output-signature "${file}.sig" --output-certificate "${file}.pem" "$file"
          done

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          assets=(target/debian/*.deb target/debian/*.sig target/debian/*.pem \
                  target/generate-rpm/*.rpm target/generate-rpm/*.sig target/generate-rpm/*.pem)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::warning::all packages already in the pool — release has no assets"
          fi
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "Release ${{ github.ref_name }}" \
            "${assets[@]}"

      - name: Trigger Packages Repository Update
        if: steps.plan.outputs.daemon == 'build' || steps.plan.outputs.cli == 'build'
        env:
          DISPATCH_TOKEN: ${{ secrets.IDLESCREEN_PACKAGES_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::error::IDLESCREEN_PACKAGES_DISPATCH_TOKEN is not set — packages repo will not update"
            exit 1
          fi
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/idlescreen/packages/dispatches \
            -d "{\"event_type\": \"new_release\", \"client_payload\": {\"repo\": \"${{ github.repository }}\", \"tag\": \"${{ github.ref_name }}\"}}"
