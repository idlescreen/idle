[package]
name = "idle-api"
version = "3.1.0"
edition = "2024"
description = "Lightweight shared API definitions, traits, and math utilities for terminal screensaver plugins."
license = "Apache-2.0"

[dependencies]
bytemuck = { version = "1.21", features = ["derive"] }
toml = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-present = { path = "../crates/wayland-present" }

[dev-dependencies]
proptest = "1"
tempfile = "3"

[[example]]
name = "minimal_saver"
path = "examples/minimal_saver.rs"

